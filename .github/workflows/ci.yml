name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  workload-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: test-workload-computed-annotations.sh
        run: .scripts/test-workload-computed-annotations.sh

      - name: test-workload-cronjob-controls.sh
        run: .scripts/test-workload-cronjob-controls.sh

      - name: test-workload-environment.sh
        run: .scripts/test-workload-environment.sh

      - name: test-workload-ownership-controls.sh
        run: .scripts/test-workload-ownership-controls.sh

      - name: test-workload-http-scaling.sh
        run: .scripts/test-workload-http-scaling.sh

      - name: test-piper-chart.sh
        run: bash .scripts/test-piper-chart.sh

  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: f2calv/gha-workflows/.github/actions/devcontainer-tool-versions@v1
        id: tools

      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.tools.outputs.helm }}

      - uses: helm/kind-action@v1

      - name: helm dependency build charts/signalcli
        run: helm dependency build charts/signalcli --skip-refresh

      - name: helm dependency build charts/piper
        run: helm dependency build charts/piper --skip-refresh

      - name: helm dependency build tests/integration
        run: helm dependency build tests/integration --skip-refresh

      - name: helm install integration
        run: helm install integration tests/integration --namespace integration --create-namespace --wait --timeout 10m

      - name: helm test integration
        run: helm test integration --namespace integration --timeout 3m --logs

      - name: kubectl get pods,pvc,events
        if: failure()
        run: kubectl get pods,pvc,events --namespace integration

  release:
    name: release (${{ matrix.chart }})
    needs: [lint, workload-tests, integration]
    strategy:
      fail-fast: false
      matrix:
        chart:
          - workload
          - signalcli
          - piper
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_publish-chart.yml
    with:
      chart: ${{ matrix.chart }}
