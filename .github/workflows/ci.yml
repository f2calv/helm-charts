name: ci

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "preview/**"
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  release:
    name: release (${{ matrix.chart }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        chart:
          - workload
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_publish-chart.yml
    with:
      chart: ${{ matrix.chart }}
    secrets: inherit
