name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  workload-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: test-workload-computed-annotations.sh
        run: .scripts/test-workload-computed-annotations.sh

      - name: test-workload-cronjob-controls.sh
        run: .scripts/test-workload-cronjob-controls.sh

      - name: test-workload-environment.sh
        run: .scripts/test-workload-environment.sh

      - name: test-workload-ownership-controls.sh
        run: .scripts/test-workload-ownership-controls.sh

  release:
    name: release (${{ matrix.chart }})
    needs: [lint, workload-tests]
    strategy:
      fail-fast: false
      matrix:
        chart:
          - workload
          - signalcli
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_publish-chart.yml
    with:
      chart: ${{ matrix.chart }}
    secrets: inherit
