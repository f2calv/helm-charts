apiVersion: v2
name: signalcli
description: Deploys the bbernhard signal-cli-rest-api container, a REST and JSON-RPC wrapper around signal-cli.
type: application
version: 1.0.0
appVersion: "0.100"
home: https://github.com/bbernhard/signal-cli-rest-api
sources:
  - https://github.com/bbernhard/signal-cli-rest-api
  - https://github.com/AsamK/signal-cli
keywords:
  - signal
  - signal-cli
  - messaging
dependencies:
  - name: workload
    version: 1.0.3
    repository: oci://ghcr.io/f2calv/charts
    # Lowercase: Helm derives the subchart's resource names from the alias, and a Kubernetes
    # resource name must be a DNS-1123 subdomain.
    alias: signalcli
