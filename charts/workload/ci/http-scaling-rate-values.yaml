kind: ScaledObject
replicaCount: 1
image:
  repository: nginx
  tag: 1.27-alpine
autoscaling:
  enabled: true
ingress:
  enabled: true
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
keda:
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.example.com:9090
        query: example_queue_depth
        threshold: "10"
  http:
    enabled: true
    scalerAddress: keda-add-ons-http-external-scaler.example:9090
    rules:
      - hosts: [api.example.com]
        headers:
          - name: X-Example
    scalingMetric:
      requestRate:
        targetValue: 100
        window: 1m
        granularity: 1s
    timeouts:
      request: 0s
