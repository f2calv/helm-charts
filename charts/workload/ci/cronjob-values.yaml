kind: CronJob
cronJobSchedule: "*/5 * * * *"
cronJobStartingDeadlineSeconds: 60
cronJobSuccessfulJobsHistoryLimit: 3
cronJobFailedJobsHistoryLimit: 2
job:
  ttlSecondsAfterFinished: ""
  backoffLimit: 2
  activeDeadlineSeconds: 120
image:
  repository: busybox
  pullPolicy: IfNotPresent
command:
  - sh
  - -c
args:
  - echo scheduled
